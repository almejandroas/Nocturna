<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rueda Nocturna</title>
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-slate-900">

  <section class="max-w-2xl mx-auto px-6 py-16 space-y-6 text-center">

    <p class="text-sm font-semibold uppercase tracking-widest text-amber-400">
      Nuevo · Jueves a sábado
    </p>

    <h1 class="text-5xl font-bold leading-tight text-white">
      Rueda Nocturna
    </h1>

    <p class="text-lg leading-relaxed text-slate-300">
      Descubre Medellín en bici cuando se encienden las luces
    </p>

    <ul class="space-y-1">
      <li class="text-2xl font-bold text-white">3 rutas</li>
      <li class="text-2xl font-bold text-white">Desde $55.000</li>
    </ul>

    <a href="#"
       class="inline-block px-6 py-3 rounded-lg shadow-md bg-amber-400 text-slate-900 font-bold uppercase tracking-wide transition hover:bg-amber-300 focus:outline-hidden focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-900">
      Inscríbete
    </a>

  </section>

  <section class="max-w-2xl mx-auto px-6 pb-16 space-y-6 text-center">

    <h2 class="text-2xl font-bold text-white">Botones</h2>

    <div class="flex flex-wrap justify-center gap-4">

      <!-- Principal -->
      <button type="button"
              class="px-6 py-3 rounded-lg shadow-md bg-amber-400 text-slate-900 font-bold uppercase tracking-wide transition hover:bg-amber-300 focus:outline-hidden focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-900">
        Principal
      </button>

      <!-- Secundario -->
      <button type="button"
              class="px-6 py-3 rounded-lg shadow-md bg-slate-700 text-white font-bold uppercase tracking-wide transition hover:bg-slate-600 focus:outline-hidden focus:ring-4 focus:ring-slate-400 focus:ring-offset-2 focus:ring-offset-slate-900">
        Secundario
      </button>

      <!-- Contorno -->
      <button type="button"
              class="px-6 py-3 rounded-lg shadow-md border-2 border-amber-400 text-amber-400 font-bold uppercase tracking-wide transition hover:bg-amber-400 hover:text-slate-900 focus:outline-hidden focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-900">
        Contorno
      </button>

    </div>
  </section>

</body>
</html>
